# module creation list
# Workflow:
# 1) Edit this TOML to match your IO tree
# 2) Generate L5X, then import in Studio 5000.
# Dependencies and Limitations:
# - All values are required for each module.
# - ParentModule names must be "Local", or match another module in this file.
# - "Backplane" and "Ethernet" can't be imported at the same time.
# - Parents must be defined before any child that references them.
# - Address maps to the module's single Upstream="true" port.
# - Use="Target" is for top-level modules whose parent is "Local".

[config]
controller_name = "Wolf_HybridMainLine"
target          = "Switch_MCP"
output_file     = "Network.L5X" # "LocNetwork.L5X" caused an error for some reason
output_dir      = "output/Hybrid Main Line"

[templates]
EN2TR     = "input/Templates/EN2TR_Module.L5X"
IB-E03B_A = "input/Templates/IBXXXX_Module.L5X"
BNI006A   = "input/Templates/IOL_Master_Module.L5X"
GLMaster = "input/Templates/GLMaster_Module.L5X"
GLTap = "input/Templates/GLTap_Module.L5X"
ELR = "input/Templates/ELRGateway_Module.L5X"
PIO = "input/Templates/PointIO_Rack.L5X"
Switch = "input/Templates/Stratix_Module.L5X"
DLRTap    = "input/Templates/DLRTap_Module.L5X"

[modules]
data = [
	{ name="Switch_MCP",	type="Switch",	ParentModule="Local",	Address="192.168.1.10" },
	{ name="SIO_MCP",	type="PIO",	ParentModule="Local",	Address="192.168.1.20" },
