# HM_Network1 module list
# Workflow:
# 1) Edit this TOML for panel updates.
# 2) Keep explicit per-station IPs (no gap logic).
# 3) Generate L5X, then import in Studio 5000.
# Dependencies and Limitations:
# - ParentModule names must match existing module names exactly.
# - Parent modules must already exist in the controller or be included in the same import.
# - Use ParentModule="Local" only for top-level anchors.
# - Parent chains are allowed only when each parent resolves in import order.
# - Import fails if any ParentModule reference is unresolved.

[config]
controller_name = "SZG_FAT34"
output_file     = "IB_Modules_4000s.L5X"
output_dir      = "output"

[templates]
parent_template = "input/EN2TR_Module.L5X"
device_templates = { IB-E03B_A = "input/IBXXXX_Module.L5X", BNI006A = "input/StaXXXX_IOL_Master_Module.L5X" }

[root_module]
name            = "DLR4000"
icp_slot        = 2
ethernet_ip     = "192.168.1.11"
parent_module   = "Local"
parent_mod_port = 1

[stations]
